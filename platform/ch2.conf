# platform/ch2.conf — 2 channels x 16 banks.
#
# This file is the ONLY place a channel count lives.  Nothing in sw/ or runtime/
# may hold one as a constant; see docs/stage1_작업지시서.md D1/D6.
#
# Every value below has answered on the board; hwdef/README.md §1-2 carries the map
# and what was measured.  Everything here is a formula plus its parameters — if a
# future image moves a window, only the parameters change.

# CONTRACT: whoever sources this must have set $EMU_TOP to emulator_top/.
# platform/select.sh and sw/setup.sh both do.
# ------------------------------------------------------------- topology ------
NCH=2                               # channels
NBANK=16                            # banks per channel (fixed by the BD)

# --------------------------------------------- control plane (BAR2) ----------
# Identical in CH1/CH2/CH4: ONE gpr_wrap, ONE dispatcher, ONE doorbell.  Channel
# selection happens inside the ISR via CH_MASK, not by a second command stream.
BAR2_AXI_BASE=0x020200000000
OFF_GPR=0x000000                    #   4 MiB   gpr_wrap_0/s_axi
OFF_CFR=0x400000                    #   4 KiB   dispatcher_top_0/s_lite
OFF_VIOL=0x401000                   #   4 KiB   viol_csr_chN, at OFF_VIOL + ch*0x1000
OFF_IMEM=0x600000                   # 512 KiB   dispatcher_top_0/s_axi

# ------------------------------------- path A: direct HBM (backdoor) ---------
# The only operand-load path the runtime uses today.  Bypasses the DRAM timing
# model, so load cost is NOT representative — that is the point; measuring load
# cost is what path B is for.
#
#   direct(ch, bank, off) = HBM_BASE + ch*HBM_CH_SPAN + bank*HBM_BANK_STRIDE + off
#
# BANK_WINDOW is the size of the decoded window; HBM_BANK_STRIDE is the spacing
# between windows.  THEY ARE NOT THE SAME NUMBER and conflating them is what made
# the old emu_hbm_direct probe 1 GiB into a 256 MiB window.
HBM_BASE=0x004000000000
HBM_CH_SPAN=0x400000000             # 16 GiB  = NBANK * HBM_BANK_STRIDE
HBM_BANK_STRIDE=0x40000000          #  1 GiB
BANK_WINDOW=0x10000000              # 256 MiB — actual per-bank capacity, and
                                    # exactly what ISR ROW (17 b x 2048 B) reaches

# ------------------------------------------- path B: MC s_axi ----------------
#   mc(ch, A) = MC_BASE + ch*MC_SPAN + A        A is a CHANNEL offset, nothing more
#
# The controller splits A itself, RoBaCo, the same order the runtime lays weights in:
#
#     31                    15 14      11 10       5 4      0
#    | ROW (17b)              | BA (4b)  | CO (6b)  | byte   |
#
# So bank is a MIDDLE field and there is no per-bank base here.  One contiguous
# 32 KiB transfer covers all 16 banks' page — exactly what an all-bank MAC reads,
# and what makes UPLOAD_PATH=mc possible at all.  Measured 2026-08-19: 623 MB/s read,
# 882 MB/s write, against 2976 / 3754 through the direct aperture.
MC_BASE=0x020400000000
MC_SPAN=0x100000000                 # 4 GiB per channel
UPLOAD_PATH=direct
# ------------------------------------------- channel address map -------------
# WHICH FIELD OF AN ADDRESS NAMES THE CHANNEL.  A register (MODE_CTRL, BAR2
# +0x405000), so switching needs a rebuild but NOT a new bitstream.
#   1  ChRoBaCo — channel is the TOP field, changes every 4 GiB.  A linear
#                 transfer stays in one channel.  This is the reset state.
#   2  RoChBaCo — channel sits under ROW, changes every 32 KiB.  A linear
#                 transfer spreads across every channel; what is left below the
#                 channel field is exactly one RoBaCo row, so an all-bank MAC's
#                 operand never straddles a channel.
# Meaningless on a 1-channel image.  scripts/setup.sh --map overrides this.
ADDR_MAP=2
                  # direct | mc   (mc is rejected by pim_open today)

# ------------------------------------------------- feature gates -------------
# NOT WIRED YET.  Every one of these is read by gen_config.sh, compiled in, and
# printed by the startup banner — and then nothing acts on it.  Changing one here
# changes what the banner says and nothing else.  See hwdef/pim_platform.c.
# ISR T field = accumulator latch select (r0/r1).
#
# MEASURED 2026-08-23 ON THE ch2 IMAGE: ISR[35] IS DECODED.  A GEMV whose two output
# groups were pointed at the two latches read back each group's own partial — 32 of
# 32 outputs — where a tied latch_sel would have put the WHOLE dot product in latch
# 0.  The old note below, that emulator_controller.v:1854 ties latch_sel to 1'b0,
# described an earlier image.
#
# THE GATE STAYS 0 ANYWAY, and that is not an oversight: hwdef's emu_isr_check()
# refuses a nonzero T outright, so flipping this alone would claim support that the
# encoder still denies.  Whatever wants to use the second latch has to say so for
# itself, with evidence.
#
# ALSO MEASURED: two latches do NOT lift the T_CCD >= 2 rule.  Both schedules break
# identically at T_CCD=1, because the rule is about beats within ONE MAC and T is
# per-ISR.  Two latches buy two independent accumulations, not a faster one.
FEATURE_T_LATCH=0

NTAIL_POLICY=pad                    # pad | serial | masked   (사양 §3.3b)
SCHEDULE=group                      # group | chunk           (사양 §3.4)

# ------------------------------------------------------------- image ---------
# The drop lives in a revision directory, the way ch1 does — reprogram.sh globs
# *.pdi at DEPTH 1 only, so this has to name the directory the PDI is actually
# in and not its parent.  It said hw/ch2 until the version1.0 drop landed.
HW_DIR="${HW_DIR:-$EMU_TOP/hw/ch2/version1.0}"
