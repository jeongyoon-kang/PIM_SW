# platform/common.conf — values that describe the BOARD, not the image on it.
#
# Sourced by platform/select.sh before the per-platform conf, so anything here can
# be overridden by chN.conf if a particular image ever needs to.
#
# NOTE none of these is a BAR *address*.  CSR_BAR is a BAR NUMBER; the address is
# read at run time from /sys/bus/pci/devices/<BDF>/resource by reprogram.sh's
# read_bar(), because it is assigned by the kernel at enumeration and changes.

# ------------------------------------------------------------------ device ----
BDF="${BDF:-0000:01:00.0}"          # lspci -nn | grep -i xilinx
DRIVER="${DRIVER:-qdma-pf}"         # kernel driver bound to it
QDEV="${QDEV:-qdma01000}"           # dma-ctl's name: "qdma" + BDF minus ':' and '.f'
CSR_BAR="${CSR_BAR:-2}"             # BAR carrying the control plane.  8 MB, windowing
                                    # onto AXI 0x0202_0000_0000.

# ------------------------------------------------------------------ tools -----
# 2025.x is /tools/Xilinx/<ver>/Vivado; 2024.x was /tools/Xilinx/Vivado/<ver> —
# the version and the Vivado directory swapped places, so an upgrade is not just
# a number here.  Override with VIVADO_SETTINGS= for another install.
VIVADO_SETTINGS="${VIVADO_SETTINGS:-/tools/Xilinx/2025.2/Vivado/settings64.sh}"
PROGRAM_TCL="${PROGRAM_TCL:-/home/kjy/pim/bank_controller/program.tcl}"

# ------------------------------------------------------------------ queues ----
# Needed ONLY for the DMA-reachable windows (IMEM / GPR / HBM).  The CFR and the
# violation CSR are AXI-Lite and go over MMIO, which is why emu_sanity can judge a
# freshly programmed board before any queue exists.
H2C_IDX="${H2C_IDX:-0}"
C2H_IDX="${C2H_IDX:-1}"
RINGSZ_IDX="${RINGSZ_IDX:-10}"      # an INDEX into the ring-size table, not a size
QMAX="${QMAX:-4096}"                # 0 at driver load; `q add` fails until raised

# ------------------------------------------------------------- permissions ----
GROUP="${GROUP:-plugdev}"

# ---------------------------------------------------------------- sanity ------
# How reprogram.sh decides the board came back healthy.
#
# It CANNOT be a read-only check on this platform.  Every register resets to zero
# and BAR2+0 is the IMEM slave whose read path is a zero-return stub, so a healthy
# freshly-programmed board reads all zeros everywhere it can be read.  emu_sanity
# writes eight DISTINCT values to the CFR timing registers and reads them back —
# which proves the BAR is mapped, that the BAR-to-AXI translation lands on the CFR,
# that each register decodes separately, and that the return path works — then
# reads the violation CSR, where zero is the correct answer and 0xffffffff would
# be the fault.
# emu_sanity lives with the other hardware probes, which is a different tree
# from the scripts — reprogram.sh is board management, the probe is a test.
SANITY_CMD="${SANITY_CMD:-$EMU_TOP/hwdef/test/emu_sanity --bdf $BDF --bar $CSR_BAR}"
