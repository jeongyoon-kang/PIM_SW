# platform/ch4.conf — 4 channels x 16 banks.
#
# Field-by-field commentary lives in ch2_v2.0.conf; this file only records what differs.
#
# WATCH THE STRIDE.  CH4 packs 64 banks into the same 32 GiB of direct aperture, so
# HBM_BANK_STRIDE HALVES to 512 MiB while BANK_WINDOW stays 256 MiB.  This is the
# one parameter that is not the same across all three images, and the reason the
# runtime must never assume window == stride.

# ------------------------------------------------------------- topology ------
NCH=4
NBANK=16

# --------------------------------------------- control plane (BAR2) ----------
# Unchanged: still ONE gpr_wrap / dispatcher / doorbell.  Only the violation CSR
# count scales — ch0..ch3 at OFF_VIOL + ch*0x1000.
BAR2_AXI_BASE=0x020200000000
OFF_GPR=0x000000
OFF_CFR=0x400000
OFF_VIOL=0x401000
OFF_IMEM=0x600000

# ------------------------------------- path A: direct HBM (backdoor) ---------
HBM_BASE=0x004000000000
HBM_CH_SPAN=0x200000000             #  8 GiB  = NBANK * HBM_BANK_STRIDE
HBM_BANK_STRIDE=0x20000000          # 512 MiB  <-- HALF of CH1/CH2
BANK_WINDOW=0x10000000              # 256 MiB  <-- unchanged

# ------------------------------------------- path B: MC s_axi ----------------
# MC decodes RoBaCo inside the channel (ROW|BA|CO); see ch2_v2.0.conf.
MC_BASE=0x020400000000
MC_SPAN=0x100000000
UPLOAD_PATH=direct


# ------------------------------------------------- feature gates -------------
# ISR T field = accumulator latch select (r0/r1).  MEASURED 2026-08-23 ON THE ch2
# IMAGE: ISR[35] IS DECODED there and the two latches are independent.  THIS IMAGE
# WAS NOT ASKED — ask it before assuming the same, because getting it wrong is a
# wrong NUMBER, not an error.  The gate stays 0 regardless: hwdef's emu_isr_check()
# refuses a nonzero T outright, so flipping this alone enables nothing.
FEATURE_T_LATCH=0
NTAIL_POLICY=pad
SCHEDULE=group

# ------------------------------------------------------------- image ---------
# IMAGE: hw/ch4
