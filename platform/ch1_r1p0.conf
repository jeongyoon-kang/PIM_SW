# platform/ch1_r1p0.conf — 1 channel x 16 banks.
#
# Field-by-field commentary lives in ch2_v2.0.conf; this file only records what differs.
# NCH=1 is not a special case in the runtime: channel(n) = (n/16) mod NCH collapses
# to 0, and a supergroup becomes a plain 16-output group.  Same code path.

# ------------------------------------------------------------- topology ------
NCH=1
NBANK=16

# --------------------------------------------- control plane (BAR2) ----------
BAR2_AXI_BASE=0x020200000000
OFF_GPR=0x000000
OFF_CFR=0x400000
OFF_VIOL=0x401000                   # only ch0 exists; +0x402000.. is undecoded here
OFF_IMEM=0x600000

# ------------------------------------- path A: direct HBM (backdoor) ---------
HBM_BASE=0x004000000000
HBM_CH_SPAN=0x400000000             # 16 GiB (only channel 0 is populated)
HBM_BANK_STRIDE=0x40000000          #  1 GiB
BANK_WINDOW=0x10000000              # 256 MiB

# ------------------------------------------- path B: MC s_axi ----------------
# MC decodes RoBaCo inside the channel (ROW|BA|CO); see ch2_v2.0.conf.
#
# THE BASE IS NOT THE ch2/ch4 ONE.  This image puts the memory slave at
# 0x0201_0000_0000, not 0x0204_0000_0000 — one 4 GiB span BELOW the control plane
# (BAR2_AXI_BASE = 0x0202_0000_0000) instead of two above it.  It is a property of
# the bitstream's address editor, not something the runtime can ask for, and getting
# it wrong is silent: the transfer lands on an undecoded region and reads back
# whatever the NoC returns rather than raising an error.
MC_BASE=0x020100000000
MC_SPAN=0x100000000
UPLOAD_PATH=direct


# ------------------------------------------------- feature gates -------------
# ISR T field = accumulator latch select (r0/r1).  MEASURED 2026-08-23 ON THE ch2
# IMAGE: ISR[35] IS DECODED there and the two latches are independent.  THIS IMAGE
# WAS NOT ASKED — ask it before assuming the same, because getting it wrong is a
# wrong NUMBER, not an error.  The gate stays 0 regardless: hwdef's emu_isr_check()
# refuses a nonzero T outright, so flipping this alone enables nothing.
FEATURE_T_LATCH=0
NTAIL_POLICY=pad
SCHEDULE=group

# ------------------------------------------------------------- image ---------
# IMAGE: hw/ch1/r1p0
