# The conda environment sw/app ran in for version1.0 (env "pim", unchanged since
# 2026-09-17), exported with `conda env export -n pim` on linux-64.  Every package
# is pinned to the exact version, and the conda ones to the exact build.
#
#     conda env create -f sw/app/environment.yml
#     conda activate pim
#
# torch is the CPU wheel (2.13.0+cpu), which only the PyTorch CPU index serves;
# the extra-index-url line below points pip there.
