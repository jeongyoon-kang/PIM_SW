  <text x="40" y="124" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="11.5" fill="#6b6b62">한 블록 = 128 B = 32 B 워드 4개. 세로 열이 같으면 같은 주소다.</text>

