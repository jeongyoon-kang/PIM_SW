  <!-- ============ title ============ -->
  <text x="40" y="40" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#17170f">GPR 되읽기 어긋남 — 128 B 블록이 다음 블록의 데이터를 담는다</text>
  <text x="40" y="62" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="12.5" fill="#6b6b62">emulator_top / ch1 · r0p0 · report.md §2.2 · 수치는 ./emu_gprloop 출력 그대로 · GPR base AXI 0x202_0000_0000</text>
  <line x1="40" y1="76" x2="960" y2="76" stroke="#dcdcd4" stroke-width="1"/>

