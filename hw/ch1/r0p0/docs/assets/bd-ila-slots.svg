      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b62"/>
    </marker>
    <marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a89e"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5f7f"/>
    </marker>
  </defs>

  <rect width="1140" height="850" fill="#fbfbf9"/>

  <text x="40" y="38" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#17170f">r0p0 블록디자인 — ILA 가 어디에 붙어 있는가</text>
  <text x="40" y="59" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="12.5" fill="#6b6b62">emu_top_fpga_bd.tcl 기준 · 간략도 (gb_wrap · cmd_bus 내부 · reset 계통 생략) · 상세는 bd-reference.md</text>
  <line x1="40" y1="74" x2="1100" y2="74" stroke="#dcdcd4"/>

