<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 850" width="1140" height="850"
     role="img" aria-label="r0p0 블록디자인 간략도: 호스트 QDMA 에서 NoC 를 거쳐 sc_host, dispatcher, gpr_wrap, emulator_controller 로 갈리고, bank 컨트롤러가 NoC 를 통해 HBM 에 닿는다. ILA 슬롯 8개와 프로브 3개가 붙은 위치를 표시했다.">
  <defs>
